<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI — Harledy Project</title>
<script src="/pages.js?v=6"></script>
<link rel="stylesheet" href="/pages.css?v=8">
<style>
.top{position:static}
.wrap{max-width:760px;padding:40px 24px 0;display:flex;flex-direction:column;min-height:calc(100vh - 63px)}
.ai-head{margin-bottom:22px}
.ai-head h1{font-size:clamp(26px,4vw,34px);margin-bottom:10px}
.hello{font-size:16.5px;line-height:1.7;color:var(--fg);max-width:56ch;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.chip{font:inherit;font-size:13.5px;color:var(--fg);background:none;border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;text-align:left;transition:color .15s,border-color .15s}
.chip:hover{color:var(--fg-h);border-color:var(--fg)}
#log{display:flex;flex-direction:column;gap:14px;flex:1;padding-bottom:18px}
.msg{max-width:92%;padding:12px 16px;border-radius:10px;font-size:15.5px;line-height:1.7;overflow-wrap:anywhere;animation:fade .25s both}
.msg.user{align-self:flex-end;color:var(--fg-h);background:var(--hover);border:1px solid var(--line);white-space:pre-wrap}
.msg.ai{align-self:flex-start;width:100%;max-width:100%;background:var(--card);border:1px solid var(--line)}
.msg.err{border-color:#b8605c}
.msg p{margin:0 0 9px}
.msg p:last-child,.msg ul:last-child,.msg ol:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:0 0 9px;padding-left:22px}
.msg li{margin:3px 0}
.msg b{color:var(--fg-h);font-weight:600}
.msg a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.msg a:hover{color:var(--fg-h)}
.msg code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;padding:1px 6px;border-radius:4px;background:var(--hover)}
.tgrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.msg a.btn-tg{color:#fff;text-decoration:none;word-break:normal}
.msg a.btn-tg:hover{color:#fff}
@media (max-width:560px){.tgrow .btn-tg{width:100%}}

/* ожидание ответа: светящийся «шар» с орбитами, мерцающий статус и скелетон-строки */
.msg.thinking{position:relative;overflow:hidden;padding:16px 18px}
.msg.thinking::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg,transparent 35%,rgba(124,92,255,.11) 50%,transparent 65%) 100% 0/250% 100%;animation:shimmer 3.2s linear infinite}
.think{display:flex;align-items:center;gap:16px;position:relative}
.orb{position:relative;flex:none;width:46px;height:46px}
.orb .core{position:absolute;inset:12px;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,#fff 0,#9ad0ff 22%,#4f86b3 55%,#7c5cff 100%);
  box-shadow:0 0 18px rgba(79,134,179,.7),0 0 34px rgba(124,92,255,.35);animation:breathe 1.8s ease-in-out infinite,hue 6s ease-in-out infinite}
.orb .ring{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 55%,rgba(42,171,238,.0) 55%,#2aabee 85%,#7c5cff 100%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:spin 1.3s linear infinite}
.orb .ring.r2{inset:5px;opacity:.7;animation-duration:2.1s;animation-direction:reverse}
.orb .sat{position:absolute;inset:0;animation:spin 2.6s linear infinite}
.orb .sat::after{content:"";position:absolute;top:-2px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(42,171,238,.9)}
.orb .sat.s2{animation-duration:3.7s;animation-direction:reverse}.orb .sat.s2::after{background:#c9b8ff;box-shadow:0 0 8px 2px rgba(124,92,255,.9);width:4px;height:4px;margin-left:-2px}
.orb .sat.s3{animation-duration:5.1s}.orb .sat.s3::after{width:3px;height:3px;margin-left:-1.5px;opacity:.8}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.82)}50%{transform:scale(1.12)}}
@keyframes hue{0%,100%{filter:hue-rotate(-15deg)}50%{filter:hue-rotate(40deg)}}
.tt{display:flex;flex-direction:column;gap:3px;min-width:0}
.shim{font-size:15px;font-weight:600;letter-spacing:.01em;color:transparent;
  background:linear-gradient(100deg,var(--mute) 30%,var(--fg-h) 50%,var(--mute) 70%) 0 0/250% 100%;
  -webkit-background-clip:text;background-clip:text;animation:shimmer 1.9s linear infinite;transition:opacity .25s}
.shim.swap{opacity:0}
.sub{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.sk{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.sk b{display:block;height:9px;border-radius:6px;position:relative;overflow:hidden;background:rgba(127,127,127,.14)}
.sk b::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(124,160,255,.28),transparent);animation:sweep 1.6s ease-in-out infinite}
.sk b:nth-child(1){width:92%}.sk b:nth-child(2){width:74%}.sk b:nth-child(2)::after{animation-delay:.15s}
.sk b:nth-child(3){width:52%}.sk b:nth-child(3)::after{animation-delay:.3s}
@keyframes sweep{to{transform:translateX(100%)}}
/* поле ввода «дышит», пока идёт ответ */
#form.busy{border-color:transparent;background:linear-gradient(var(--card),var(--card)) padding-box,
  linear-gradient(90deg,#2aabee,#7c5cff,#2aabee) border-box;background-size:auto,200% 100%;animation:flow 2s linear infinite}
@keyframes flow{to{background-position:0 0,-200% 0}}

/* маленькие кнопки под названием и описанием инструмента */
.tbtns{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0 4px}
.tb-set{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.tb-name{font-size:12.5px;font-weight:600;color:var(--fg-h);margin-right:2px}
.msg a.tb{display:inline-block;padding:3px 11px;border-radius:7px;font-size:12.5px;font-weight:600;line-height:1.5;text-decoration:none;word-break:normal;
  border:1px solid var(--line);transition:background .15s,color .15s,border-color .15s}
.msg a.tb.main{color:var(--accent);border-color:var(--accent)}
.msg a.tb.main:hover{background:var(--accent);color:#fff}
.msg a.tb.alt{color:var(--fg)}
.msg a.tb.alt:hover{color:var(--fg-h);border-color:var(--fg)}
.tst{font-size:12px;color:var(--mute)}
.tst::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--mute);vertical-align:0}
.tst.ok::before{background:#5fb98a}.tst.bad::before{background:#e0706a}
.msg li .tbtns{margin:6px 0 2px}

.composer{position:sticky;bottom:0;padding:12px 0 18px;background:linear-gradient(transparent,var(--bg) 24%)}
#form{display:flex;gap:10px;align-items:flex-end;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);transition:border-color .2s}
#form:focus-within,#form.busy{border-color:var(--accent)}
#q{flex:1;resize:none;max-height:160px;min-height:26px;border:0;outline:0;background:none;color:var(--fg-h);font:inherit;font-size:15.5px;line-height:1.6;padding:6px 4px}
#q::placeholder{color:var(--mute)}
#send{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:8px;color:#fff;background:var(--accent);cursor:pointer;transition:filter .15s,opacity .2s}
#send:hover:not(:disabled){filter:brightness(1.12)}
#send:disabled{opacity:.35;cursor:default}
#send svg{width:19px;height:19px}
.fine{margin-top:8px;font-size:12.5px;color:var(--mute)}
@media (max-width:560px){.wrap{padding:28px 16px 0}.msg{max-width:100%}.fine{display:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}.msg.thinking::before,.orb .sat,.sk b::after,#form.busy{animation:none}.orb .core{animation:none}.orb .ring{animation-duration:4s}.shim{animation:none;color:var(--mute);background:none;-webkit-background-clip:border-box;background-clip:border-box}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a id="back" class="home" data-home href="/#nointro">← На главную</a>
  <a class="logo" data-home href="/#nointro" aria-label="Harledy Project — на главную"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Harledy Project</a>
  <nav class="menu" aria-label="Разделы">
    <a href="/about">О нас</a>
    <a href="/collab">Сотрудничество</a>
    <a href="/ai" aria-current="page">AI</a>
    <a class="terms" href="/terms"><span class="full">Пользовательское соглашение</span><span class="short">Соглашение</span></a>
  </nav>
</div></header>
<main class="wrap">
  <header class="ai-head">
    <p class="kicker">Ассистент</p>
    <h1>Harledy AI</h1>
  </header>

  <section id="intro">
    <p class="hello">Спросите о чем угодно у нашего ИИ-ассистента. Например, какие инструменты есть для поиска данных</p>
    <div class="chips" id="chips">
      <button class="chip" type="button">Какие инструменты есть для поиска данных?</button>
      <button class="chip" type="button">Кто создатель проекта?</button>
      <button class="chip" type="button">Where can I find your Telegram channel?</button>
    </div>
  </section>

  <div id="log" aria-live="polite"></div>

  <div class="composer">
    <form id="form" autocomplete="off">
      <textarea id="q" rows="1" maxlength="1000" placeholder="Напишите вопрос…" aria-label="Ваш вопрос"></textarea>
      <button id="send" type="submit" aria-label="Отправить" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </form>
    <p class="fine">Enter — отправить, Shift+Enter — новая строка</p>
  </div>
</main>
<script src="/ai.js?v=3"></script>
</body>
</html>
