<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI — Harledy Project</title>
<link rel="stylesheet" href="/pages.css?v=4">
<style>
.wrap{max-width:760px;padding:84px 24px 0;display:flex;flex-direction:column;min-height:100vh}
.wrap>*{animation:none}
/* фирменная надпись — как на главной */
.head{text-align:center;margin-bottom:26px}
.head h1{display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(28px,6vw,40px);font-weight:800;color:var(--fg-h);line-height:1.15;margin:0;letter-spacing:0}
.head h1 svg{width:clamp(24px,5vw,32px);height:clamp(24px,5vw,32px)}
.lupa *{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .7s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tag{margin-top:2px;padding-left:.34em;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--mute)}
.hello{max-width:600px;margin:0 auto 18px;text-align:center;font-size:17px;line-height:1.7;color:var(--fg-h);opacity:.88}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 auto 22px;max-width:640px}
.chip{font:inherit;font-size:13px;color:var(--fg);background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;transition:color .2s,border-color .2s}
.chip:hover{color:var(--fg-h);border-color:var(--accent)}
#log{display:flex;flex-direction:column;gap:12px;flex:1;padding-bottom:18px}
.msg{max-width:92%;padding:13px 17px;border-radius:16px;font-size:15.5px;line-height:1.7;overflow-wrap:anywhere;animation:rise .35s both}
.msg.user{align-self:flex-end;color:var(--fg-h);background:rgba(79,134,179,.14);border:1px solid rgba(79,134,179,.4);white-space:pre-wrap}
.msg.ai{align-self:flex-start;width:100%;max-width:100%;background:var(--card);border:1px solid var(--line)}
.msg.err{border-color:rgba(200,90,90,.55)}
.msg p{margin:0 0 9px}
.msg p:last-child,.msg ul:last-child,.msg ol:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:0 0 9px;padding-left:22px}
.msg li{margin:3px 0}
.msg b{color:var(--fg-h)}
.msg a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(79,134,179,.4);word-break:break-all}
.msg a:hover{color:var(--fg-h);border-color:var(--fg-h)}
.msg code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;padding:1px 6px;border-radius:6px;background:rgba(127,127,127,.15)}
.dots{display:inline-flex;gap:5px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:sticky;bottom:0;padding:12px 0 18px;background:linear-gradient(transparent,var(--bg) 24%)}
#form{display:flex;gap:10px;align-items:flex-end;padding:10px;border:1px solid var(--line);border-radius:16px;background:var(--card);transition:border-color .2s}
#form:focus-within{border-color:var(--accent)}
#q{flex:1;resize:none;max-height:160px;min-height:26px;border:0;outline:0;background:none;color:var(--fg-h);font:inherit;font-size:15.5px;line-height:1.6;padding:4px 6px}
#q::placeholder{color:var(--mute)}
#send{flex:none;width:42px;height:42px;display:grid;place-items:center;border:1px solid rgba(79,134,179,.55);border-radius:12px;color:var(--accent);background:rgba(79,134,179,.12);cursor:pointer;transition:color .2s,background .2s,opacity .2s}
#send:hover:not(:disabled){color:#fff;background:var(--accent)}
#send:disabled{opacity:.45;cursor:default}
#send svg{width:20px;height:20px}
.fine{margin-top:8px;text-align:center;font-size:12px;color:var(--mute)}
@media (max-width:560px){.wrap{padding:76px 16px 0}.msg{max-width:100%}.fine{display:none}}
@media (prefers-reduced-motion:reduce){.msg{animation:none}.lupa *{animation:none;stroke-dashoffset:0}.dots i{animation:none;opacity:.6}}
</style>
</head>
<body>
<div class="bar"><a id="back" class="pill" href="/">← На главную</a></div>
<main class="wrap">
  <header class="head">
    <h1>
      <svg class="lupa" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <span>Harledy Project</span>
    </h1>
    <p class="tag">AI</p>
  </header>

  <section id="intro">
    <p class="hello">Спросите о чем угодно у нашего ИИ-ассистента. Например, какие инструменты есть для поиска данных</p>
    <div class="chips" id="chips">
      <button class="chip" type="button">Какие инструменты есть для поиска данных?</button>
      <button class="chip" type="button">Кто создатель проекта?</button>
      <button class="chip" type="button">Where can I find your Telegram channel?</button>
    </div>
  </section>

  <div id="log" aria-live="polite"></div>

  <div class="composer">
    <form id="form" autocomplete="off">
      <textarea id="q" rows="1" maxlength="1000" placeholder="Напишите вопрос…" aria-label="Ваш вопрос"></textarea>
      <button id="send" type="submit" aria-label="Отправить" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </form>
    <p class="fine">Enter — отправить, Shift+Enter — новая строка</p>
  </div>
</main>
<script src="/ai.js?v=1"></script>
</body>
</html>
